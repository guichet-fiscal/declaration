# Essais automatiques du guichet : lancés à chaque envoi sur GitHub (et à la main depuis l'onglet Actions).
# Un essai en échec met la coche en rouge ; les captures d'écran des pages en cause sont jointes.
name: Essais
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  essais:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node lancer.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-des-essais
          path: tests/sorties/
          if-no-files-found: ignore
